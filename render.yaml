databases:
  - name: wilo-arac-takip-db
    plan: free

services:
  - type: web
    name: wilo-arac-takip
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wilo-arac-takip-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
