<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş - WILO Araç Takip Sistemi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #009C82 0%, #007A65 100%);
        padding: 16px;
    }
    .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
        width: 100%;
        max-width: 380px;
        overflow: hidden;
    }
    .card-header {
        background: #009C82;
        color: #fff;
        padding: 28px 24px;
        text-align: center;
    }
    .card-header .icon-box {
        width: 56px; height: 56px;
        background: #fff;
        color: #009C82;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
        margin: 0 auto 12px;
    }
    .card-header h1 { font-size: 18px; font-weight: 700; }
    .card-header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }
    .card-body { padding: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #009C82; }
    button {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        background: #009C82;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
    }
    button:hover { background: #007A65; }
    button:disabled { opacity: 0.6; cursor: default; }
    #errorMsg {
        display: none;
        margin-top: 12px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        font-size: 12px;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 8px;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon-box"><i class="fa-solid fa-car-side"></i></div>
            <h1>WILO Araç Takip Sistemi</h1>
            <p>Devam etmek için lütfen şifrenizi girin</p>
        </div>
        <div class="card-body">
            <form id="loginForm">
                <label for="passwordInput">ŞİFRE</label>
                <input type="password" id="passwordInput" autofocus required>
                <div id="errorMsg"><i class="fa-solid fa-triangle-exclamation"></i> Şifre hatalı. Lütfen tekrar deneyin.</div>
                <button type="submit" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const password = document.getElementById('passwordInput').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kontrol ediliyor...';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorMsg.style.display = 'block';
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                }
            } catch (err) {
                errorMsg.textContent = 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.';
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Giriş Yap';
            }
        });
    </script>
</body>
</html>
